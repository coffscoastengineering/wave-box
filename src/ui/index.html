<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Claude Box — Template Generator</title>
<style>/*CSS*/</style>
</head>
<body>
<main class="layout">
  <form id="form" class="panel" novalidate aria-label="Box size and timber">
    <div class="panel-head">
      <p class="eyebrow">Build Settings</p>
      <h1>Template setup</h1>
    </div>

    <fieldset>
      <legend><i class="bracket" aria-hidden="true"></i>Box size <span class="legend-unit">mm</span></legend>
      <div class="field"><label for="H">Height</label><input id="H" name="H" type="number" inputmode="decimal" class="num"><p class="err" id="H-err" role="alert"></p></div>
      <div class="field"><label for="D">Depth, front to back</label><input id="D" name="D" type="number" inputmode="decimal" class="num"><p class="err" id="D-err" role="alert"></p></div>
      <div class="field"><label for="W">Carcass width</label><input id="W" name="W" type="number" inputmode="decimal" class="num"><p class="err" id="W-err" role="alert"></p></div>
      <label class="check-row"><input type="checkbox" id="lock-proportions" checked><span>Keep original height/depth proportions</span></label>
    </fieldset>

    <fieldset>
      <legend><i class="bracket" aria-hidden="true"></i>Timber thickness <span class="legend-unit">mm</span></legend>
      <div class="preset-row" role="group" aria-label="Material preset">
        <button type="button" data-preset="light">Light</button>
        <button type="button" data-preset="standard" aria-pressed="true">Standard</button>
        <button type="button" data-preset="heavy">Heavy</button>
      </div>
      <div class="field"><label for="walnut"><i class="sw walnut" aria-hidden="true"></i>Side timber</label><input id="walnut" name="walnut" type="number" inputmode="decimal" class="num"><p class="err" id="walnut-err" role="alert"></p></div>
      <div class="field"><label for="carcass"><i class="sw carcass" aria-hidden="true"></i>Carcass</label><input id="carcass" name="carcass" type="number" inputmode="decimal" class="num"><p class="err" id="carcass-err" role="alert"></p></div>
      <div class="field"><label for="drawer"><i class="sw drawer" aria-hidden="true"></i>Drawers &amp; lid</label><input id="drawer" name="drawer" type="number" inputmode="decimal" class="num"><p class="err" id="drawer-err" role="alert"></p></div>
      <div class="field"><label for="gap">Side stand-off gap</label><input id="gap" name="gap" type="number" inputmode="decimal" class="num"><p class="err" id="gap-err" role="alert"></p></div>
    </fieldset>

    <fieldset>
      <legend><i class="bracket" aria-hidden="true"></i>Output</legend>
      <div class="seg" role="radiogroup" aria-label="Paper size">
        <label><input type="radio" name="paper" value="A4" checked><span>A4<small class="page-count" data-paper="A4"></small></span></label>
        <label><input type="radio" name="paper" value="A3"><span>A3<small class="page-count" data-paper="A3"></small></span></label>
        <label><input type="radio" name="paper" value="A2"><span>A2<small class="page-count" data-paper="A2"></small></span></label>
      </div>
      <div class="seg" role="radiogroup" aria-label="Page orientation">
        <label><input type="radio" name="orientation" value="auto" checked><span>Auto</span></label>
        <label><input type="radio" name="orientation" value="portrait"><span>Portrait</span></label>
        <label><input type="radio" name="orientation" value="landscape"><span>Landscape</span></label>
      </div>
    </fieldset>

    <button type="button" id="reset" class="link">Reset to original design</button>
  </form>

  <section class="stage" aria-label="Preview and downloads">
    <div class="preview-card">
      <div class="preview-head">
        <h2>Side view</h2>
        <div class="preview-meta">
          <p id="safety" class="safety" data-state="good"></p>
          <p id="overall" class="overall num"></p>
        </div>
      </div>

      <div class="tabs" role="tablist" aria-label="Show tier" id="tabs"></div>
      <div class="chips" role="tablist" aria-label="Show part" id="chips" hidden></div>

      <div id="preview" class="preview" role="img" aria-label="Side view of the box"></div>
      <div id="dimline" class="dimline" aria-hidden="true"></div>

      <ul class="legend" aria-label="Legend">
        <li><i class="sw walnut"></i>Side, see-through</li>
        <li><i class="sw carcass"></i>Carcass</li>
        <li><i class="sw drawer"></i>Drawers &amp; lid</li>
        <li><i class="sw hole"></i>Ø20 dowel</li>
      </ul>
    </div>

    <div id="warnings" class="warnings" role="status" aria-live="polite" hidden></div>

    <div class="actions">
      <button type="button" id="pdf" class="primary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7m0-7L10 14M19 14v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h6"/></svg>
        View printable templates (PDF)
      </button>
      <button type="button" id="instructions" class="secondary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        Instructions
      </button>
      <button type="button" id="svg" class="secondary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
        SVG
      </button>
      <button type="button" id="dxf" class="secondary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17 10 7l4 7 2-3 4 6M4 20h16"/></svg>
        DXF
      </button>
    </div>
    <p class="hint">Print at <strong>100 % / “Actual size”</strong> — never “Fit to page”.</p>

    <details class="cutlist">
      <summary>Cut list</summary>
      <div class="table-wrap"><table id="cutlist"><thead><tr><th>Part</th><th>Qty</th><th>Timber</th><th>Finished size</th><th>Block / notes</th></tr></thead><tbody></tbody></table></div>
    </details>

    <details class="instructions-panel" open>
      <summary>Instructions</summary>
      <ol id="instructions-list"></ol>
    </details>
  </section>
</main>
<script>/*JS*/</script>
</body>
</html>
