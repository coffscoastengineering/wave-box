<!doctype html>
<meta charset="utf-8">
<title>pdf view</title>
<style>body{margin:0;background:#888;display:flex;flex-wrap:wrap;gap:8px;padding:8px}canvas{background:#fff}</style>
<script type="module">
import * as pdfjs from '/node_modules/pdfjs-dist/build/pdf.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = '/node_modules/pdfjs-dist/build/pdf.worker.mjs';
const q = new URLSearchParams(location.search);
const doc = await pdfjs.getDocument({ url: q.get('f') }).promise;
const [a, b] = (q.get('p') ?? '1-4').split('-').map(Number);
for (let i = a; i <= Math.min(b ?? a, doc.numPages); i++) {
  const page = await doc.getPage(i);
  const vp = page.getViewport({ scale: Number(q.get('s') ?? 1.2) });
  const c = document.createElement('canvas');
  c.width = vp.width; c.height = vp.height;
  document.body.append(c);
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
}
document.title = `done ${doc.numPages}`;
</script>
