<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Box — Template Generator</title>
<style>:root {
  --bg: #111413;
  --panel: #1d231f;
  --panel-2: #222923;
  --ink: #f4efe2;
  --ink-soft: #c7bdac;
  --muted: #8f9a8d;
  --line: #394238;
  --line-strong: #58624f;
  --brass: #c9923c;
  --brass-2: #e0ad58;
  --brass-ink: #17120a;
  --blue: #82acd0;
  --tan: #d9bf84;
  --walnut: #8b542d;
  --walnut-dark: #583217;
  --danger: #ef9b7e;
  --danger-bg: #37221b;
  --danger-line: #724536;
  --focus: #8fc4ff;
  --radius: 8px;
  --shadow: 0 24px 70px rgba(0, 0, 0, .28);
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  --sans: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 var(--sans);
}

.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.layout {
  display: grid;
  grid-template-columns: minmax(300px, 340px) minmax(0, 1fr);
  gap: 24px;
  width: min(1500px, calc(100% - 40px));
  margin: 0 auto;
  padding: 22px 0 52px;
}

.panel,
.preview-card,
.warnings,
.cutlist {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.panel::after,
.preview-card::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: inherit;
  color: var(--brass);
  background:
    linear-gradient(currentColor, currentColor) top left / 16px 2px no-repeat,
    linear-gradient(currentColor, currentColor) top left / 2px 16px no-repeat,
    linear-gradient(currentColor, currentColor) top right / 16px 2px no-repeat,
    linear-gradient(currentColor, currentColor) top right / 2px 16px no-repeat,
    linear-gradient(currentColor, currentColor) bottom left / 16px 2px no-repeat,
    linear-gradient(currentColor, currentColor) bottom left / 2px 16px no-repeat,
    linear-gradient(currentColor, currentColor) bottom right / 16px 2px no-repeat,
    linear-gradient(currentColor, currentColor) bottom right / 2px 16px no-repeat;
  opacity: .9;
}

.panel {
  align-self: start;
  position: sticky;
  top: 18px;
  padding: 18px;
}

.panel-head {
  padding: 2px 0 16px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--line);
}

.eyebrow {
  margin: 0 0 3px;
  color: var(--brass-2);
  font: 12px/1.2 var(--mono);
  text-transform: uppercase;
}

.panel-head h1 { margin: 0; font-size: 18px; line-height: 1.2; letter-spacing: 0; }

fieldset {
  border: 0;
  margin: 0 0 24px;
  padding: 0;
}

fieldset:last-of-type { margin-bottom: 18px; }

legend {
  display: flex;
  align-items: center;
  margin-bottom: 12px;
  padding: 0;
  color: var(--ink);
  font-size: 13px;
  font-weight: 800;
}

.bracket {
  width: 10px;
  height: 10px;
  margin-right: 9px;
  border-left: 2px solid var(--brass);
  border-bottom: 2px solid var(--brass);
  flex: none;
}

.legend-unit {
  margin-left: 8px;
  color: var(--muted);
  font: 11px/1 var(--mono);
}

.field {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 96px;
  gap: 5px 12px;
  align-items: center;
  margin-bottom: 9px;
}

.field label {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #f7f0e2;
  font-size: 14px;
}

.field input {
  width: 100%;
  min-height: 44px;
  padding: 8px 10px;
  border: 1px solid #495247;
  border-radius: 7px;
  background: #252b26;
  color: var(--ink);
  font-size: 15px;
  text-align: right;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.03);
}

.field input:hover { border-color: #67715f; }
.field input[aria-invalid="true"] { border-color: var(--danger); background: var(--danger-bg); }

.err {
  grid-column: 1 / -1;
  min-height: 0;
  margin: 0;
  color: var(--danger);
  font-size: 12px;
}

.err:empty { display: none; }

.check-row {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
  margin-top: 12px;
  padding: 9px 10px;
  border: 1px solid #3f493d;
  border-radius: 7px;
  background: #181d1a;
  color: var(--ink-soft);
  font-size: 13px;
  cursor: pointer;
}

.check-row input {
  width: 18px;
  height: 18px;
  margin: 0;
  accent-color: var(--brass);
}

.sw {
  display: inline-block;
  width: 12px;
  height: 12px;
  flex: none;
  border: 1px solid rgba(0,0,0,.38);
  border-radius: 3px;
}

.sw.walnut { background: var(--walnut); }
.sw.carcass { background: var(--tan); }
.sw.drawer { background: var(--blue); }
.sw.hole { background: #fff; border-color: var(--danger); border-radius: 50%; }

.seg {
  display: flex;
  overflow: hidden;
  border: 1px solid #596154;
  border-radius: 7px;
  background: #181d1a;
}

.seg label {
  position: relative;
  flex: 1;
  min-width: 0;
}

.seg input {
  position: absolute;
  inset: 0;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}

.seg span {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 44px;
  padding: 6px 8px;
  color: var(--ink-soft);
  font-weight: 650;
  cursor: pointer;
}

.seg label + label span { border-left: 1px solid #596154; }
.seg input:checked + span { background: var(--brass); color: var(--brass-ink); }
.seg input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: -3px; }

.page-count {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 400;
  opacity: .8;
}
.page-count:empty::before { content: '\00a0'; }

.preset-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 14px;
}

.preset-row button {
  min-height: 44px;
  padding: 6px 8px;
  border: 1px solid #4a5448;
  background: #1a201c;
  color: var(--ink-soft);
  font-size: 13px;
  font-weight: 750;
}

.preset-row button:hover { border-color: var(--line-strong); color: var(--ink); }
.preset-row button[aria-pressed="true"] {
  border-color: var(--brass);
  background: var(--brass);
  color: var(--brass-ink);
}

button {
  min-height: 44px;
  border-radius: 7px;
  font: inherit;
  cursor: pointer;
}

button:focus-visible,
input:focus-visible,
summary:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.link {
  min-height: 44px;
  padding: 4px 0;
  border: 0;
  background: none;
  color: var(--brass-2);
  font-size: 13px;
  text-align: left;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.stage {
  display: grid;
  align-content: start;
  gap: 16px;
  min-width: 0;
}

.preview-card {
  min-width: 0;
  padding: 18px;
  overflow: hidden;
}

.preview-head {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: start;
}

.preview-head h2 { margin: 0; font-size: 18px; line-height: 1.25; }
.preview-meta {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}

.overall,
.safety {
  margin: 0;
  padding: 5px 9px;
  border: 1px solid #3f493d;
  border-radius: 999px;
  background: #151916;
  color: var(--ink-soft);
  font-size: 12px;
  white-space: nowrap;
}

.safety {
  font-weight: 800;
}

.safety::before {
  content: "";
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 6px;
  border-radius: 50%;
  background: #66c58a;
}

.safety[data-state="warn"] {
  border-color: var(--danger-line);
  color: var(--danger);
}

.safety[data-state="warn"]::before { background: var(--danger); }

.tabs {
  display: flex;
  gap: 2px;
  min-width: 0;
  margin-top: 16px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
}

.tab {
  flex: none;
  min-height: 44px;
  padding: 8px 12px;
  border: 0;
  border-bottom: 2px solid transparent;
  border-radius: 0;
  background: none;
  color: #d8cfbf;
  font-size: 13px;
  font-weight: 650;
}

.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--brass-2); }

.chips {
  display: flex;
  gap: 8px;
  min-width: 0;
  overflow-x: auto;
  padding: 12px 2px 4px;
}

.chips.scrollable {
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 34px), transparent);
  mask-image: linear-gradient(to right, #000 calc(100% - 34px), transparent);
}

.chip {
  position: relative;
  display: flex;
  flex: none;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  min-width: 68px;
  min-height: 76px;
  padding: 7px 8px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #202720;
  color: var(--ink-soft);
  transition: background-color 150ms ease-out, border-color 150ms ease-out, transform 150ms ease-out;
}

.chip:hover { border-color: var(--brass); transform: translateY(-1px); }
.chip[aria-selected="true"] { background: #2d281d; border-color: var(--brass); color: var(--ink); }
.chip svg { width: 34px; height: 34px; overflow: visible; }
.chip svg path { fill: none; stroke: currentColor; stroke-width: 3; }
.chip .chip-label {
  max-width: 84px;
  overflow: hidden;
  color: inherit;
  font-size: 11px;
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chip .qty {
  position: absolute;
  top: -6px;
  right: -6px;
  min-width: 18px;
  height: 18px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--brass);
  color: var(--brass-ink);
  font: 12px/18px var(--mono);
  text-align: center;
}

.preview {
  width: 100%;
  aspect-ratio: 16 / 8.7;
  max-height: 46vh;
  margin-top: 16px;
  border: 1px solid #2d352d;
  border-radius: 7px;
  background:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px),
    #151a17;
  background-size: 24px 24px;
}

.preview svg {
  width: 100%;
  height: 100%;
  display: block;
}

.preview .part {
  stroke: #2b2018;
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
  transition: opacity 150ms ease-out;
}

.preview .part:hover { opacity: .8; }
.preview .walnut { fill: var(--walnut); fill-opacity: .33; stroke: var(--walnut-dark); stroke-width: 2; }
.preview .carcass { fill: var(--tan); }
.preview .drawer { fill: var(--blue); }
.preview .hole { fill: #fff; stroke: var(--danger); stroke-width: 1.5; vector-effect: non-scaling-stroke; }

.dimline {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  height: 22px;
  margin-top: 9px;
  padding: 0 2px;
  color: var(--blue);
}

.dimline::before,
.dimline::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 1px;
  height: 10px;
  background: currentColor;
  transform: translateY(-50%);
}

.dimline::before { left: 0; }
.dimline::after { right: 0; }
.dim-line { flex: 1; height: 1px; background: currentColor; }
.dim-label {
  padding: 0 6px;
  background: var(--panel);
  color: var(--blue);
  font-size: 12px;
  white-space: nowrap;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  margin: 12px 0 0;
  padding: 0;
  color: var(--ink-soft);
  font-size: 13px;
  list-style: none;
}

.legend li { display: flex; align-items: center; gap: 8px; }

.warnings {
  padding: 13px 16px;
  background: var(--danger-bg);
  border-color: var(--danger-line);
  color: var(--danger);
  box-shadow: none;
}

.warnings-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  font-weight: 800;
}

.warnings-head svg {
  width: 18px;
  height: 18px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linejoin: round;
  stroke-linecap: round;
}

.warnings ul { margin: 8px 0 0; padding-left: 18px; }
.warnings li { margin: 4px 0; }

.actions {
  position: sticky;
  bottom: 12px;
  z-index: 8;
  display: grid;
  grid-template-columns: minmax(230px, 1fr) 112px 112px;
  gap: 10px;
  align-items: stretch;
  margin: -8px;
  padding: 8px;
  border-radius: 10px;
  background: rgba(17, 20, 19, .82);
  backdrop-filter: blur(12px);
}

.primary,
.secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-height: 50px;
  padding: 9px 16px;
  border-radius: 7px;
  font-weight: 800;
}

.primary {
  border: 0;
  background: var(--brass);
  color: var(--brass-ink);
  box-shadow: 0 12px 28px rgba(201, 146, 60, .22);
}

.primary:hover { background: var(--brass-2); }
.primary:active, .secondary:active { transform: translateY(1px); }

.secondary {
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--ink);
}

.secondary:hover { border-color: var(--line-strong); background: #293028; }
.primary svg,
.secondary svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

button:disabled { opacity: .52; cursor: not-allowed; }
.hint { margin: -4px 0 0; color: var(--ink-soft); font-size: 13px; }

.cutlist {
  overflow: hidden;
  padding: 0;
  box-shadow: none;
}

.cutlist summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 54px;
  padding: 0 16px;
  cursor: pointer;
  font-weight: 800;
  list-style: none;
}

.cutlist summary::-webkit-details-marker { display: none; }
.cutlist summary::after {
  content: "";
  width: 9px;
  height: 9px;
  flex: none;
  border-right: 2px solid var(--ink-soft);
  border-bottom: 2px solid var(--ink-soft);
  transform: rotate(45deg);
  transition: transform 150ms ease-out;
}

.cutlist[open] summary::after { transform: rotate(-135deg); }
.table-wrap { overflow-x: auto; border-top: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td {
  padding: 10px 12px;
  border-top: 1px solid rgba(255,255,255,.06);
  text-align: left;
  vertical-align: top;
}

tbody tr:first-child td { border-top: 0; }
th {
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
}

td:nth-child(2) { text-align: center; font-family: var(--mono); }
td:nth-child(4) { font-family: var(--mono); color: var(--ink); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

@media (max-width: 980px) {
  .layout {
    grid-template-columns: 1fr;
    width: min(100% - 28px, 780px);
    padding-top: 18px;
  }
  .panel { position: relative; top: auto; }
}

@media (max-width: 640px) {
  body { font-size: 14px; }
  .layout { width: calc(100% - 20px); gap: 14px; }
  .panel, .preview-card { padding: 14px; }
  .field { grid-template-columns: 1fr 88px; }
  .preview-head { grid-template-columns: 1fr; }
  .overall { width: fit-content; }
  .preview { aspect-ratio: 4 / 3; max-height: 52vh; }
  .actions { grid-template-columns: 1fr 1fr; }
  .primary { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<main class="layout">
  <form id="form" class="panel" novalidate aria-label="Box size and timber">
    <div class="panel-head">
      <p class="eyebrow">Build Settings</p>
      <h1>Template setup</h1>
    </div>

    <fieldset>
      <legend><i class="bracket" aria-hidden="true"></i>Box size <span class="legend-unit">mm</span></legend>
      <div class="field"><label for="H">Height</label><input id="H" name="H" type="number" inputmode="decimal" class="num"><p class="err" id="H-err" role="alert"></p></div>
      <div class="field"><label for="D">Depth, front to back</label><input id="D" name="D" type="number" inputmode="decimal" class="num"><p class="err" id="D-err" role="alert"></p></div>
      <div class="field"><label for="W">Carcass width</label><input id="W" name="W" type="number" inputmode="decimal" class="num"><p class="err" id="W-err" role="alert"></p></div>
      <label class="check-row"><input type="checkbox" id="lock-proportions" checked><span>Keep original height/depth proportions</span></label>
    </fieldset>

    <fieldset>
      <legend><i class="bracket" aria-hidden="true"></i>Timber thickness <span class="legend-unit">mm</span></legend>
      <div class="preset-row" role="group" aria-label="Material preset">
        <button type="button" data-preset="light">Light</button>
        <button type="button" data-preset="standard" aria-pressed="true">Standard</button>
        <button type="button" data-preset="heavy">Heavy</button>
      </div>
      <div class="field"><label for="walnut"><i class="sw walnut" aria-hidden="true"></i>Side timber</label><input id="walnut" name="walnut" type="number" inputmode="decimal" class="num"><p class="err" id="walnut-err" role="alert"></p></div>
      <div class="field"><label for="carcass"><i class="sw carcass" aria-hidden="true"></i>Carcass</label><input id="carcass" name="carcass" type="number" inputmode="decimal" class="num"><p class="err" id="carcass-err" role="alert"></p></div>
      <div class="field"><label for="drawer"><i class="sw drawer" aria-hidden="true"></i>Drawers &amp; lid</label><input id="drawer" name="drawer" type="number" inputmode="decimal" class="num"><p class="err" id="drawer-err" role="alert"></p></div>
      <div class="field"><label for="gap">Side stand-off gap</label><input id="gap" name="gap" type="number" inputmode="decimal" class="num"><p class="err" id="gap-err" role="alert"></p></div>
    </fieldset>

    <fieldset>
      <legend><i class="bracket" aria-hidden="true"></i>Output</legend>
      <div class="seg" role="radiogroup" aria-label="Paper size">
        <label><input type="radio" name="paper" value="A4" checked><span>A4<small class="page-count" data-paper="A4"></small></span></label>
        <label><input type="radio" name="paper" value="A3"><span>A3<small class="page-count" data-paper="A3"></small></span></label>
        <label><input type="radio" name="paper" value="A2"><span>A2<small class="page-count" data-paper="A2"></small></span></label>
      </div>
    </fieldset>

    <button type="button" id="reset" class="link">Reset to original design</button>
  </form>

  <section class="stage" aria-label="Preview and downloads">
    <div class="preview-card">
      <div class="preview-head">
        <h2>Side view</h2>
        <div class="preview-meta">
          <p id="safety" class="safety" data-state="good"></p>
          <p id="overall" class="overall num"></p>
        </div>
      </div>

      <div class="tabs" role="tablist" aria-label="Show tier" id="tabs"></div>
      <div class="chips" role="tablist" aria-label="Show part" id="chips" hidden></div>

      <div id="preview" class="preview" role="img" aria-label="Side view of the box"></div>
      <div id="dimline" class="dimline" aria-hidden="true"></div>

      <ul class="legend" aria-label="Legend">
        <li><i class="sw walnut"></i>Side, see-through</li>
        <li><i class="sw carcass"></i>Carcass</li>
        <li><i class="sw drawer"></i>Drawers &amp; lid</li>
        <li><i class="sw hole"></i>Ø20 dowel</li>
      </ul>
    </div>

    <div id="warnings" class="warnings" role="status" aria-live="polite" hidden></div>

    <div class="actions">
      <button type="button" id="pdf" class="primary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7m0-7L10 14M19 14v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h6"/></svg>
        View printable templates (PDF)
      </button>
      <button type="button" id="svg" class="secondary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
        SVG
      </button>
      <button type="button" id="dxf" class="secondary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17 10 7l4 7 2-3 4 6M4 20h16"/></svg>
        DXF
      </button>
    </div>
    <p class="hint">Print at <strong>100 % / “Actual size”</strong> and check the scale square before cutting.</p>
